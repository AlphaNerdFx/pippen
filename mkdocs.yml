site_name: PIPPEN
site_description: Reliability-adjusted NBA player impact estimates with calibrated uncertainty
site_url: https://alphanerdfx.github.io/pippen/
repo_url: https://github.com/AlphaNerdFx/pippen
repo_name: AlphaNerdFx/pippen
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 The PIPPEN Authors. Apache-2.0.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# The research corpus stays in the repository as a record, but is not rendered:
# it is prior work with known broken citations, not project documentation.
exclude_docs: |
  research/*.md
  !research/index.md

nav:
  - Home: index.md
  - Guides:
      - Installation: guides/installation.md
      - Quickstart: guides/quickstart.md
      - Data layout: guides/data-layout.md
      - Data licensing: guides/licensing.md
  - Method:
      - Overview: methodology/index.md
      - RAPM: methodology/rapm.md
      - Measuring reliability: methodology/reliability.md
      - Limitations: methodology/limitations.md
      - Errata in the research: methodology/errata.md
  - Architecture:
      - Pipeline: architecture/index.md
      - Deployment: architecture/deployment.md
      - Continuous integration: architecture/ci.md
      - Decisions:
          - Overview: architecture/decisions/index.md
          - 0001 Python as orchestration: architecture/decisions/0001-python-as-orchestration-layer.md
          - 0002 Outcome-gated phases: architecture/decisions/0002-outcome-gated-phases.md
  - API reference:
      - paths: reference/paths.md
      - repro: reference/repro.md
      - cli: reference/cli.md
      - data.hoopr: reference/data-hoopr.md
      - data.nba_api: reference/data-nba-api.md
      - data.schemas: reference/data-schemas.md
  - Research notes:
      - Overview: research/index.md
