name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Note: astral-sh/setup-uv and github-action-benchmark publish no moving
# major tag (setup-uv stopped after v7), so both are pinned to an exact
# version and must be bumped by hand. The rest track a major tag.

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          # mypy targets 3.10, the minimum this package supports. It must run on
          # that version too: on a newer interpreter it resolves newer dependency
          # stubs, and numpy's use PEP 695 syntax that a 3.10 target cannot parse.
          python-version: "3.10"
      - run: uv sync --extra dev
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - name: pytest
        run: uv run pytest -m "not network" --cov --cov-report=xml --cov-report=term
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata renders on PyPI
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The manifests are never applied to a cluster: this project runs on free
      # tiers. Validating them in CI is what keeps them honest, so the
      # Kubernetes path is written and checked rather than claimed.
      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      # KServe types live in a CRD, so the default schema set does not know
      # them. -strict rejects unknown fields; without the CRD location every
      # resource would be skipped and the step would pass having checked nothing.
      - name: Validate against the KServe CRD schema
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/kubernetes/

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds from a clean checkout, which is Phase 5's stated exit condition.
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t pippen:ci .
      - name: The service answers on a non-root container
        run: |
          docker run -d --name pippen-ci -p 7860:7860 pippen:ci
          # curl's own bounded retry, not a shell loop. CONTRIBUTING.md forbids
          # polling in a loop, and --retry-connrefused covers the boot window
          # while still exiting on its own.
          curl -fsS --retry 20 --retry-delay 2 --retry-connrefused \
            http://localhost:7860/health | tee /dev/stderr | grep -q '"status":"ok"'
          test "$(docker exec pippen-ci id -u)" = "10001"
          docker rm -f pippen-ci

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --extra docs
      # --strict turns broken links and missing pages into build failures.
      - run: uv run mkdocs build --strict
