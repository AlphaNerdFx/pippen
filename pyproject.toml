[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pippen"
dynamic = ["version"]
description = "Reliability-adjusted NBA player impact estimates with calibrated uncertainty"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The PIPPEN Authors" }]
keywords = ["nba", "basketball", "analytics", "rapm", "sports-analytics", "plus-minus"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "duckdb>=1.0",
  "pandera>=0.20",
  "requests>=2.31",
  "typer>=0.12",
  "rich>=13.0",
  "platformdirs>=4.0",
  "tenacity>=8.2",
]

[project.optional-dependencies]
sources = ["nba_api>=1.10", "pbpstats>=1.3"]
fit = ["numpyro>=0.15", "jax>=0.4.28", "lightgbm>=4.3", "optuna>=4.0", "mlflow>=2.16", "shap>=0.45"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8"]
dashboard = ["streamlit>=1.38", "plotly>=5.23"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "mkdocs-gen-files>=0.5"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "types-requests",
  "pandas-stubs",
]
# Slower checks that prove the numbers rather than the syntax. Kept out of `dev`
# so the everyday install stays fast; CI installs this explicitly.
rigour = [
  "mutmut>=3.2",
  "pytest-benchmark>=5.0",
  "pytest-randomly>=3.15",
]

[project.urls]
Homepage = "https://github.com/AlphaNerdFx/pippen"
Documentation = "https://alphanerdfx.github.io/pippen/"
Repository = "https://github.com/AlphaNerdFx/pippen"
Issues = "https://github.com/AlphaNerdFx/pippen/issues"
Changelog = "https://github.com/AlphaNerdFx/pippen/blob/main/CHANGELOG.md"

[project.scripts]
pippen = "pippen.cli:app"

[tool.hatch.version]
path = "src/pippen/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pippen"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# The research documents are source material and are never reformatted.
extend-exclude = [
  "docs/research", ".context", "GLOBAL_SESSION.md", "CLAUDE.md",
  # mutmut writes deliberately-broken copies of the source here.
  "mutants",
]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # isort
  "N",         # pep8-naming
  "UP",        # pyupgrade
  "B",         # bugbear
  "A",         # builtins shadowing
  "C4",        # comprehensions
  "PT",        # pytest style
  "SIM",       # simplify
  "PTH",       # use pathlib
  "RUF",       # ruff-specific
  "D",         # pydocstyle
]
ignore = [
  "D107",   # missing docstring in __init__
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "E501",   # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104"]
"scripts/**" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
plugins = []

[[tool.mypy.overrides]]
module = [
  "pbpstats.*", "nba_api.*", "duckdb.*", "sklearn.*", "scipy.*",
  "numpyro.*", "jax.*", "lightgbm.*", "shap.*", "optuna.*", "mlflow.*",
  "streamlit.*", "plotly.*", "pandera.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
# Benchmarks are excluded from the default run: they are slow and they need
# the `rigour` extra. The Rigour workflow targets tests/benchmarks directly.
testpaths = ["tests/unit", "tests/integration", "tests/property"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "network: test requires network access (deselect with '-m \"not network\"')",
  "slow: test takes more than a few seconds",
  "benchmark: performance measurement, tracked for regressions across commits",
  "determinism: asserts an identical result across repeated runs",
]
filterwarnings = ["error::DeprecationWarning:pippen.*"]

# ---------------------------------------------------------------- mutmut
# Mutation testing deliberately breaks the source and checks that a test fails.
# Coverage proves a line ran; this proves the line was actually verified.
[tool.mutmut]
paths_to_mutate = ["src/pippen/"]
tests_dir = ["tests/"]
# Only offline tests: a mutant must not be killed by a network flake.
runner = "python -m pytest -x -q -m 'not network and not benchmark' -p no:randomly"

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src/pippen"]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
